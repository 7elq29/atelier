<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>In-app Notifications — Atelier UI Mock</title>
  <link rel="stylesheet" href="shared.css" />
  <style>
    html, body { height: 100%; margin: 0; }
    .mock-frame { min-height: 100vh; }
    .mock-body  { height: calc(100vh - 32px); overflow: hidden; }

    /* ── App shell context ──────────────────────────────────────────────── */
    #app {
      display: flex;
      flex-direction: column;
      height: 100%;
      background: var(--bg-app);
      position: relative;
      overflow: hidden;
    }

    .title-bar {
      height: 48px;
      background: var(--bg-sidebar);
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      padding: 0 14px;
      flex-shrink: 0;
    }
    .title-bar-wordmark {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: -0.3px;
      color: var(--text-primary);
    }

    .app-body { display: flex; flex: 1; overflow: hidden; }

    .sidebar-stub {
      width: 220px;
      background: var(--bg-sidebar);
      border-right: 1px solid var(--border-subtle);
      flex-shrink: 0;
      padding: 10px 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .sidebar-row {
      height: 30px;
      border-radius: var(--r-sm);
      background: var(--bg-hover);
      opacity: 0.3;
    }
    .sidebar-row:nth-child(2) { width: 75%; }
    .sidebar-row:nth-child(3) { width: 60%; }
    .sidebar-row:nth-child(4) { width: 82%; margin-top: 10px; }

    .main-stub {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-tertiary);
      font-size: 13px;
      letter-spacing: .2px;
    }

    /* ── Notification stack — fixed right edge ──────────────────────────── */
    .notif-stack {
      position: fixed;
      top: 56px;
      right: 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      z-index: 150;
      pointer-events: none;
      max-height: calc(100vh - 96px);
    }

    /* ── Notification toast ─────────────────────────────────────────────── */
    .notif-toast {
      width: 280px;
      background: color-mix(in srgb, var(--bg-panel-raised) 65%, transparent);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border-strong);
      box-shadow: var(--shadow-popover);
      border-radius: var(--r-md);
      padding: 11px 12px;
      pointer-events: all;
      position: relative;
      flex-shrink: 0;
      animation: notif-in .18s ease forwards;
    }

    @keyframes notif-in {
      from { opacity: 0; transform: translateX(10px); }
      to   { opacity: 1; transform: translateX(0); }
    }
    .notif-toast.notif-out {
      animation: notif-out .14s ease forwards;
      pointer-events: none;
    }
    @keyframes notif-out {
      to { opacity: 0; transform: translateX(8px); }
    }

    .notif-dismiss {
      position: absolute;
      top: 9px;
      right: 9px;
      width: 16px;
      height: 16px;
      border: none;
      background: transparent;
      color: var(--text-disabled);
      cursor: pointer;
      border-radius: 3px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      transition: color .1s;
    }
    .notif-dismiss:hover { color: var(--text-secondary); }

    /* Title — same weight/size as app-toast */
    .notif-title {
      font-size: 13.5px;
      color: var(--text-primary);
      line-height: 1.35;
      padding-right: 18px; /* clear dismiss button */
    }

    /* Subtitle */
    .notif-sub {
      font-size: 12px;
      color: var(--text-secondary);
      margin-top: 3px;
      line-height: 1.4;
    }

    /* Countdown — baked into subtitle line via JS, no separate element needed */



    /* ── Mock controls ──────────────────────────────────────────────────── */
    .mock-controls {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--bg-sidebar);
      border-top: 1px solid var(--border-subtle);
      padding: 7px 14px;
      display: flex;
      gap: 7px;
      align-items: center;
      z-index: 200;
      flex-wrap: wrap;
    }
    .ctrl-label { font-size: 11px; color: var(--text-tertiary); font-weight: 500; }
    .ctrl-sep { width: 1px; height: 18px; background: var(--border-subtle); margin: 0 3px; flex-shrink: 0; }
  </style>
</head>
<body>

<svg style="display:none" xmlns="http://www.w3.org/2000/svg">
  <symbol id="i-x" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
    <line x1="18" y1="6" x2="6" y2="18"/>
    <line x1="6"  y1="6" x2="18" y2="18"/>
  </symbol>
</svg>

<div class="mock-frame">
  <div class="mock-label">
    MOCK — In-app floating notifications ·
    <a href="index.html">← Interactive mock</a>
  </div>

  <div class="mock-body">
    <div id="app">

      <header class="title-bar">
        <span class="title-bar-wordmark">Atelier</span>
      </header>

      <div class="app-body">
        <div class="sidebar-stub">
          <div class="sidebar-row"></div>
          <div class="sidebar-row"></div>
          <div class="sidebar-row"></div>
          <div class="sidebar-row"></div>
        </div>
        <div class="main-stub">App content</div>
      </div>

      <!-- Toast stack, top-right -->
      <div class="notif-stack" id="notifStack"></div>

    </div>
  </div>

  <div class="mock-controls">
    <span class="ctrl-label">Fire:</span>
    <button class="btn btn-sm" onclick="fireMeeting()">Meeting (10 min)</button>
    <button class="btn btn-sm" onclick="fireTask()">Task reminder</button>
    <button class="btn btn-sm" onclick="fireSystem()">System alert</button>
    <button class="btn btn-sm" onclick="fireSession()">Session alert</button>
    <div class="ctrl-sep"></div>
    <button class="btn btn-sm" onclick="fireStack()">Stack ×3</button>
    <div class="ctrl-sep"></div>
    <button class="btn btn-sm" onclick="toggleTheme()">Light / Dark</button>
  </div>
</div>

<script>
let uid = 0

// ── Core ─────────────────────────────────────────────────────────────────────

function notify({ title, sub = '', countdown = false, actions = [], autoMs = 9000 }) {
  const id = ++uid
  const el = buildToast({ id, title, sub, countdown, actions, autoMs })
  const stack = document.getElementById('notifStack')

  const visible = stack.querySelectorAll('.notif-toast')
  if (visible.length >= 4) expire(visible[visible.length - 1])

  stack.prepend(el)
  if (autoMs) setTimeout(() => dismiss(id), autoMs)
  if (countdown) startCountdown(id, 10 * 60)
}

function buildToast({ id, title, sub, countdown }) {
  const el = document.createElement('div')
  el.className = 'notif-toast'
  el.id = `nt-${id}`

  // Countdown is inlined on the same line as the subtitle
  const subHtml = sub
    ? `<div class="notif-sub">${esc(sub)}${countdown ? ` · <span id="cd-${id}" style="font-variant-numeric:tabular-nums">in 10:00</span>` : ''}</div>`
    : countdown
      ? `<div class="notif-sub"><span id="cd-${id}" style="font-variant-numeric:tabular-nums">in 10:00</span></div>`
      : ''

  el.innerHTML = `
    <button class="notif-dismiss" onclick="dismiss(${id})" title="Dismiss">
      <svg width="9" height="9"><use href="#i-x"/></svg>
    </button>
    <div class="notif-title">${esc(title)}</div>
    ${subHtml}
  `
  return el
}

// ── Actions ───────────────────────────────────────────────────────────────────

function handleAction(id, actionId, btn) {
  const toast = document.getElementById(`nt-${id}`)
  if (!toast) return
  const actionsDiv = toast.querySelector('.notif-actions')

  if (actionId === 'join') {
    actionsDiv.innerHTML = `<span style="font-size:12px;color:var(--text-tertiary)">Opening…</span>`
    setTimeout(() => dismiss(id), 1200)
  } else if (actionId === 'snooze') {
    actionsDiv.innerHTML = `<span style="font-size:12px;color:var(--text-tertiary)">Snoozed 5 min</span>`
    setTimeout(() => dismiss(id), 5000)
  } else if (actionId === 'open') {
    dismiss(id)
  } else if (actionId === 'refresh') {
    btn.textContent = 'Refreshing…'
    btn.disabled = true
    setTimeout(() => dismiss(id), 1200)
  } else if (actionId === 'view') {
    dismiss(id)
  }
}

function dismiss(id) {
  const el = document.getElementById(`nt-${id}`)
  if (el) expire(el)
}

function expire(el) {
  if (el.classList.contains('notif-out')) return
  el.classList.add('notif-out')
  setTimeout(() => el.remove(), 160)
}

// ── Countdown ─────────────────────────────────────────────────────────────────

function startCountdown(id, totalSecs) {
  let rem = totalSecs
  const tick = () => {
    const el = document.getElementById(`cd-${id}`)
    if (!el) return
    if (rem <= 0) { el.textContent = 'starting now'; return }
    const m = Math.floor(rem / 60)
    const s = rem % 60
    el.textContent = `in ${m}:${String(s).padStart(2, '0')}`
    rem--
    setTimeout(tick, 1000)
  }
  tick()
}

// ── Preset triggers ───────────────────────────────────────────────────────────

function fireMeeting() {
  notify({
    title: 'Weekly Eng Sync',
    sub: '10:00 AM',
    countdown: true,
    autoMs: 14000,
  })
}

function fireTask() {
  notify({
    title: 'Daily standup notes due',
    sub: 'Today at 11:00 AM',
    autoMs: 9000,
  })
}

function fireSystem() {
  notify({
    title: 'Auth token expiring soon',
    sub: 'Uber GenAI auth expires in 2 hours',
    autoMs: 0,
  })
}

function fireSession() {
  notify({
    title: 'Session needs attention',
    sub: 'go-code refactor · waiting for approval',
    autoMs: 0,
  })
}

function fireStack() {
  fireMeeting()
  setTimeout(fireTask,    280)
  setTimeout(fireSystem,  560)
}

// ── Theme ─────────────────────────────────────────────────────────────────────

function toggleTheme() {
  const h = document.documentElement
  h.setAttribute('data-theme', h.getAttribute('data-theme') === 'dark' ? 'light' : 'dark')
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
}
</script>
</body>
</html>
