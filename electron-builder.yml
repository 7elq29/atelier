appId: com.atelier.app
productName: Atelier
directories:
  buildResources: build
  output: release
files:
  - out/**/*
  - package.json
mac:
  target: dir
  category: public.app-category.developer-tools
  icon: icon.icns
win:
  target: dir
linux:
  target: dir
npmRebuild: true
asarUnpack:
  - '**/*.node'
  - '**/node_modules/@anthropic-ai/claude-agent-sdk-*/claude'
  - '**/node_modules/@anthropic-ai/claude-agent-sdk-*/claude.exe'
